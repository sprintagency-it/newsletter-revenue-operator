<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Newsletter Revenue Operator">
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#dbe6ff" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="10" dy="10" stdDeviation="0" flood-color="#171512" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#fbfaf7"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="190" cy="120" r="140" fill="#f4c95d" opacity="0.22"/>
  <circle cx="1010" cy="512" r="180" fill="#11735b" opacity="0.12"/>
  <g transform="translate(76 74)">
    <rect width="70" height="70" rx="12" fill="#f4c95d" stroke="#171512" stroke-width="5"/>
    <text x="35" y="44" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="900" fill="#171512">NRO</text>
    <text x="90" y="31" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900" fill="#171512">Newsletter Revenue Operator</text>
    <text x="90" y="60" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#11735b">Private beta</text>
  </g>
  <text x="78" y="255" font-family="Inter, Arial, sans-serif" font-size="74" font-weight="950" fill="#171512">
    <tspan x="78" dy="0">Turn your email list</tspan>
    <tspan x="78" dy="84">into weekly revenue</tspan>
    <tspan x="78" dy="84">newsletter drafts.</tspan>
  </text>
  <text x="82" y="530" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600" fill="#6a6258">
    Built from your business context, offer, audience, voice and content.
  </text>
  <g transform="translate(808 170)" filter="url(#shadow)">
    <rect width="284" height="300" rx="8" fill="#fffdf8" stroke="#171512" stroke-width="4"/>
    <rect x="28" y="34" width="130" height="34" rx="17" fill="#f4c95d" stroke="#171512" stroke-width="2"/>
    <text x="93" y="57" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="900" fill="#171512">BUSINESS BRAIN</text>
    <text x="28" y="112" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="950" fill="#171512">
      <tspan x="28" dy="0">Weekly</tspan>
      <tspan x="28" dy="38">newsletter</tspan>
      <tspan x="28" dy="38">system</tspan>
    </text>
    <rect x="28" y="228" width="72" height="28" rx="14" fill="#ffffff" stroke="#ded7cc"/>
    <rect x="110" y="228" width="72" height="28" rx="14" fill="#ffffff" stroke="#ded7cc"/>
    <rect x="192" y="228" width="64" height="28" rx="14" fill="#ffffff" stroke="#ded7cc"/>
    <text x="64" y="247" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#171512">offer</text>
    <text x="146" y="247" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#171512">voice</text>
    <text x="224" y="247" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800" fill="#171512">CTA</text>
  </g>
</svg>
